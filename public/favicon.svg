<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Vrund Patel">
  <defs>
    <linearGradient id="vp-bg" x1="4" y1="2" x2="60" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.52" stop-color="#7182f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <radialGradient id="vp-sheen" cx="0.26" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vp-core" cx="0.34" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c9e9ff"/>
      <stop offset="1" stop-color="#5fdcf5"/>
    </radialGradient>
  </defs>

  <!-- Gradient tile: holds its own against light and dark browser chrome -->
  <rect width="64" height="64" rx="15" fill="url(#vp-bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#vp-sheen)"/>

  <!-- Solid hexagonal shell — a filled silhouette stays crisp down to 16px,
       where thin strokes turn to mush. Stroked in its own colour so the
       corners round off. -->
  <path d="M32 12.5 L48.89 22.25 L48.89 41.75 L32 51.5 L15.11 41.75 L15.11 22.25 Z"
        fill="#080a16" stroke="#080a16" stroke-width="3.4" stroke-linejoin="round"/>

  <!-- Facets: only resolve at larger sizes, harmless at favicon scale -->
  <g stroke="#ffffff" stroke-opacity="0.11" stroke-width="1.5" stroke-linecap="round">
    <path d="M32 14 L32 32 M47 40.9 L32 32 M17 40.9 L32 32"/>
  </g>

  <!-- Glowing core -->
  <circle cx="32" cy="32" r="7.7" fill="url(#vp-core)"/>
  <circle cx="32" cy="32" r="7.7" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="0.9"/>

  <rect x="0.6" y="0.6" width="62.8" height="62.8" rx="14.4" fill="none" stroke="#080a16" stroke-opacity="0.2" stroke-width="1.2"/>
</svg>
